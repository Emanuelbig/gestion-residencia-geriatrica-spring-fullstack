spring.application.name=residenciaGeriatrica

spring.datasource.url=jdbc:mysql://localhost:3306/geriatrico
spring.datasource.username=youruser
spring.datasource.password=yourpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Las pantallas son JSP: el controller devuelve "personas" y Spring abre /WEB-INF/jsp/personas.jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# La sesión (donde viaja el aviso verde después del redirect) va solo en una cookie, no pegada a la URL (;jsessionid=...)
server.servlet.session.tracking-modes=cookie

# Usuario y clave reales: van en secreto.properties (al lado de este archivo).
# Ese archivo NO se sube a GitHub (está en .gitignore) y sus valores reemplazan a los de arriba.
spring.config.import=optional:classpath:secreto.properties
